<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rekdi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #f3f0ea;
      color: #111;
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 0.95;
    }

    .menu-item strong {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    a {
      color: inherit;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 999;
      background: rgba(243,240,234,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-left {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .nav-left img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: #111;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 600;
    }

    section {
      position: relative;
      overflow: hidden;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      background:
        linear-gradient(
          rgba(243,240,234,0.42),
          rgba(243,240,234,0.50)
        ),
        url('assets/rekdi2ndfloor.jpg') center/cover no-repeat;

      padding: 140px 24px 100px;
    }

    .hero-content {
      max-width: 760px;
    }

    .hero-logo {
      width: 190px;
      margin-bottom: 42px;
      opacity: 0.96;
    }

    .hero h1 {
      font-size: clamp(3.5rem, 10vw, 8rem);
      line-height: 0.9;
      margin-bottom: 34px;
      text-transform: uppercase;
    }

    .hero p {
      font-size: 1.15rem;
      margin-bottom: 12px;
    }

    .menu-section {
      position: relative;
      padding: 120px 8vw;
      background: #f7f3ed;
    }

    .menu-section::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          rgba(255,255,255,0.50),
          rgba(255,255,255,0.58)
        ),
        url('assets/rekdirestoceiling.jpg') center/cover no-repeat;

      opacity: 1;
      pointer-events: none;
    }

    .menu-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 70px;
      max-width: 1400px;
      margin: auto;
    }

    .menu-column h2,
    .story h2,
    .careers h2,
    .find h2 {
      text-transform: uppercase;
      margin-bottom: 42px;
      font-size: 2rem;
    }

    .menu-item {
      margin-bottom: 18px;
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .menu-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .transition-section {
      position: relative;
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;

      background-image: url("assets/rekdibarceiling.jpg");
      background-size: cover;
      background-position: center;
    }

    .transition-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.58);
    }

    .transition-content {
      position: relative;
      z-index: 2;
      max-width: 720px;
      color: #f3efe8;
    }

    .transition-content h2 {
      font-size: clamp(2.2rem,5vw,4rem);
      margin-bottom: 24px;
      transform: rotate(-1deg);
    }

    .transition-content p {
      font-size: 1rem;
      line-height: 1.8;
      color: rgba(255,255,255,0.82);
      margin-bottom: 34px;
    }

    .transition-link {
      display: inline-block;
      padding: 12px 26px;
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: all 0.25s ease;
    }

    .transition-link:hover {
      background: #fff;
      color: #111;
    }

    .bar-intro {
      background: #121015;
      color: #f2ece6;
      padding: 120px 8vw;
    }

    .bar-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
      max-width: 1400px;
      margin: auto;
    }

    .bar-copy h2 {
      font-size: 4rem;
      margin-bottom: 30px;
    }

    .bar-copy p {
      font-size: 1.05rem;
      margin-bottom: 10px;
    }

    .bar-image img {
      width: 100%;
      border-radius: 6px;
      display: block;
      opacity: 0.95;
    }

    .bar-menu {
      position: relative;
      color: #f2ece6;
      padding: 120px 8vw;
      overflow: hidden;
    }

    .bar-menu::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          rgba(15,12,18,0.70),
          rgba(15,12,18,0.78)
        ),
        url('assets/rekdibarwallart.jpg') center/cover no-repeat;

      opacity: 1;
      z-index: 0;
    }

    .bar-menu .menu-grid {
      position: relative;
      z-index: 1;
    }

    .story,
    .find {
      padding: 120px 8vw;
      max-width: 1200px;
      margin: auto;
    }

    .story-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .story-copy p {
      margin-bottom: 22px;
      max-width: 600px;
    }

    .story-image img {
      width: 100%;
      display: block;
      border-radius: 6px;
    }

    .careers {
      position: relative;
      color: #f3eee7;
      padding: 120px 8vw;
      overflow: hidden;
    }

    .careers::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          rgba(12,10,14,0.74),
          rgba(12,10,14,0.82)
        ),
        url('assets/rekdi3rdfloor.jpg') center/cover no-repeat;

      z-index: 0;
    }

    .careers > * {
      position: relative;
      z-index: 1;
    }

    .find-layout {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 60px;
      align-items: start;
      margin-top: 50px;
    }

    .reserve-btn {
      position: fixed;
      right: 24px;
      bottom: 24px;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      z-index: 999;
    }

    @media (max-width: 900px) {

      nav {
        padding: 16px 20px;
      }

      .menu-grid,
      .bar-layout,
      .find-layout,
      .story-layout {
        grid-template-columns: 1fr;
      }

      .nav-links {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .menu-section,
      .bar-menu,
      .bar-intro,
      .story,
      .careers,
      .find {
        padding: 80px 24px;
      }

      .hero p {
        font-size: 1rem;
      }

      .bar-copy h2 {
        font-size: 2.5rem;
      }

      .menu-item {
        font-size: 0.88rem;
      }

      iframe {
        height: 320px;
      }

    }

  </style>
</head>

<body>

</body>
</html>
